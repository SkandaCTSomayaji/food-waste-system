{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h3 class="mb-3">Create account</h3>
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input class="form-control mb-3" name="name" placeholder="Name / Organisation" required>
      <input class="form-control mb-3" type="email" name="email" placeholder="Email" required>
      <input class="form-control mb-3" type="tel" name="phone" placeholder="Phone number (e.g. 9876543210)" required>
      <input class="form-control mb-3" type="password" name="password" placeholder="Password" minlength="6" required>
      <select class="form-select mb-3" name="role" required>
        <option value="donor">Donor (restaurant / hotel / event)</option>
        <option value="ngo">NGO (collects food)</option>
      </select>
      <button class="btn btn-success w-100">Register</button>
    </form>
  </div>
</div>
{% endblock %}
