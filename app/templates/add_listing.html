{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h3 class="mb-3">Add Surplus Food</h3>
    <form method="POST" enctype="multipart/form-data">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input class="form-control mb-3" name="title" placeholder="Food item (e.g. Veg biryani)" required>
      <input class="form-control mb-3" type="number" step="0.1" min="0.1" name="quantity" placeholder="Quantity in kg" required>

      <label class="form-label">Expiry time</label>
      <input class="form-control mb-3" type="datetime-local" name="expiry_time" required>

      <textarea class="form-control mb-3" name="pickup_address" rows="2" placeholder="Pickup address" required></textarea>

      <button type="button" id="locBtn" class="btn btn-outline-success mb-1">📍 Use my current location</button>
      <small id="locStatus" class="text-muted d-block mb-3">Location not set (optional)</small>
      <input type="hidden" name="latitude" id="lat">
      <input type="hidden" name="longitude" id="lng">

      <label class="form-label">Food photo (optional, max 5 MB)</label>
      <input class="form-control mb-2" type="file" name="image" id="imageInput" accept="image/jpeg,image/png,image/webp">
      <img id="preview" class="img-fluid rounded mb-3 d-none" style="max-height:200px" alt="Preview">

      <button class="btn btn-success w-100">Post Food</button>
    </form>
  </div>
</div>

<script>
  const status = document.getElementById('locStatus');
  document.getElementById('locBtn').addEventListener('click', () => {
    if (!navigator.geolocation) {
      status.textContent = 'Location is not supported by this browser.';
      return;
    }
    status.textContent = 'Getting your location...';
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const lat = pos.coords.latitude.toFixed(6);
        const lng = pos.coords.longitude.toFixed(6);
        document.getElementById('lat').value = lat;
        document.getElementById('lng').value = lng;
        status.textContent = '✅ Location captured (' + lat + ', ' + lng + ')';
      },
      (err) => { status.textContent = 'Could not get location: ' + err.message; },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  });

  document.getElementById('imageInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    const preview = document.getElementById('preview');
    if (file) {
      preview.src = URL.createObjectURL(file);
      preview.classList.remove('d-none');
    } else {
      preview.classList.add('d-none');
    }
  });
</script>
{% endblock %}
